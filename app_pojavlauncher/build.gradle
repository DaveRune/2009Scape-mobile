plugins {
    id 'com.android.application' version '7.4.2'
}

def pluginSources = file("$rootDir/plugins")
def generatedPluginAssets = file("$buildDir/generated/plugin-assets")
def clientJar = file("$projectDir/src/main/assets/rt4.jar")

// Android refuses to install a build numbered lower than the one already on the device.
// The project this is forked from numbers its releases 9934841 plus the CI run number, so this
// sits above that range to install over them. Raise both of these for every release.
// The name must not match a property of the defaultConfig block, or that wins and this is ignored.
static def getReleaseNumber() {
    return 9950001
}

def getVersionName = {
    return "hd-3.1"
}

configurations {
    instrumentedClasspath {
        canBeConsumed = false
        canBeResolved = true
    }
}

android {
    namespace 'net.kdt.pojavlaunch'

    compileSdk = 33


    signingConfigs {
        customDebug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        googlePlayBuild {
            storeFile file("upload.jks")
            storePassword System.getenv("GPLAY_KEYSTORE_PASSWORD")
            keyAlias "upload"
            keyPassword System.getenv("GPLAY_KEYSTORE_PASSWORD")
        }
    }

    defaultConfig {
        applicationId "net.kdt.pojavlaunch"
        minSdkVersion 21
        targetSdkVersion 33
        versionCode getReleaseNumber()
        versionName getVersionName()
        multiDexEnabled true //important
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.customDebug
            resValue 'string', 'application_package', 'net.kdt.pojavlaunch.debug'
            resValue 'string', 'storageProviderAuthorities', 'net.kdt.pojavlaunch.scoped.gamefolder.debug'
            resValue 'string', 'shareProviderAuthority', 'net.kdt.pojavlaunch.scoped.controlfolder.debug'
        }
        proguard {
            initWith debug
            minifyEnabled true
            shrinkResources true
        }

        release {
            // Don't set to true or java.awt will be a.a or something similar.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // defaultConfig already set
            // multiDexEnabled = true
            // debuggable = true
            resValue 'string', 'storageProviderAuthorities', 'net.kdt.pojavlaunch.scoped.gamefolder'
            resValue 'string', 'application_package', 'net.kdt.pojavlaunch'
        }
        gplay {
            initWith release
            signingConfig signingConfigs.googlePlayBuild
        }
    }

    ndkVersion = "25.2.9519653"

    externalNativeBuild {
        ndkBuild {
            path file('src/main/jni/Android.mk')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    buildToolsVersion = '33.0.2'
    lint {
        abortOnError false
    }

    sourceSets {
        main {
            assets.srcDirs += generatedPluginAssets
        }
    }
}

// A plugin with source in this repository is compiled and packed on every build, so the app cannot ship one
// that is older than the source or miss one that nobody remembered to pack. The packed zips are build output
// and are never committed. A plugin with no source here, meaning somebody else's, keeps its committed zip.
task packPlugins {
    inputs.dir pluginSources
    outputs.dir generatedPluginAssets

    doLast {
        delete generatedPluginAssets
        File packInto = new File(generatedPluginAssets, 'plugins')
        packInto.mkdirs()

        pluginSources.listFiles({ File candidate -> candidate.isDirectory() } as FileFilter).each { plugin ->
            File sources = new File(plugin, 'src')
            if (!sources.isDirectory()) return
            if (new File(plugin, '.dev-only').exists()) {
                logger.lifecycle("packPlugins: skipping ${plugin.name}, it is marked as dev only")
                return
            }

            Set<File> javaFiles = fileTree(sources) { include '**/*.java' }.files
            if (javaFiles.isEmpty()) return

            File classes = new File(buildDir, "plugin-classes/${plugin.name}")
            delete classes
            classes.mkdirs()

            exec {
                executable org.gradle.internal.jvm.Jvm.current().javacExecutable
                args '--release', '8', '-cp', clientJar.absolutePath, '-d', classes.absolutePath
                args javaFiles.collect { it.absolutePath }
            }

            ant.zip(destfile: new File(packInto, "${plugin.name}.zip"), basedir: classes)
            logger.lifecycle("packPlugins: packed ${plugin.name}")
        }
    }
}

// Everything downstream of preBuild then has a path to it, including the lint tasks that read the assets and
// refuse to run against a folder produced by a task they have no ordering against.
preBuild.dependsOn packPlugins

dependencies {
    implementation 'javax.annotation:javax.annotation-api:1.3.2'
    implementation 'commons-codec:commons-codec:1.15'
    // implementation 'com.wu-man:android-bsf-api:3.1.3'
    implementation 'androidx.preference:preference:1.2.0'
    //implementation 'androidx.core:core:1.7.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0-beta01'
    implementation 'androidx.annotation:annotation:1.5.0'

    implementation "androidx.constraintlayout:constraintlayout:2.1.4"

    implementation 'com.github.duanhong169:checkerboarddrawable:1.0.2'
    implementation 'com.github.PojavLauncherTeam:portrait-sdp:ed33e89cbc'
    implementation 'com.github.PojavLauncherTeam:portrait-ssp:6c02fd739b'
    implementation 'com.github.Mathias-Boulay:ExtendedView:1.0.0'
    implementation 'com.github.Mathias-Boulay:android_gamepad_remapper:71397676b5'


    // implementation 'com.intuit.sdp:sdp-android:1.0.5'
    // implementation 'com.intuit.ssp:ssp-android:1.0.5'

    implementation 'org.tukaani:xz:1.8'
    implementation 'com.github.PojavLauncherTeam:exp4j:60eaec6f78'
    implementation 'net.sourceforge.htmlcleaner:htmlcleaner:2.6.1'

    // implementation 'net.sourceforge.streamsupport:streamsupport-cfuture:1.7.0'

    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.5.0'
}
